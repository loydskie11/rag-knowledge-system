version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    env_file:
      - ./backend/.env
    environment:
      # Override the localhost AI URL so the container can reach your host machine's Ollama
      - AI_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Optional: uncomment this volume mapping if you want live reloading for dev
    # volumes:
    #   - ./backend:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "80:80"  # Frontend will be accessible at http://localhost
    depends_on:
      - backend
