<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CAR Form 3 - Logsheet</title>
    <style>
        @page { size: A4 portrait; margin: 15mm; }
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.2; color: #000; margin: 0; padding: 0; }
        .header-container { display: flex; justify-content: space-between; margin-bottom: 25px; align-items: flex-start; }
        .header-left { font-weight: bold; font-size: 11pt; padding-top: 5px; }
        .header-right { text-align: left; font-size: 9pt; line-height: 1.4; width: 140px; }
        .main-title { text-align: center; font-weight: bold; font-size: 12pt; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
        th, td { border: 1px solid #000; padding: 8px 6px; text-align: center; vertical-align: middle; }
        th { font-weight: bold; font-size: 9.5pt; }
        td { font-size: 9pt; height: 28px; }
        .footer-sig { margin-top: 40px; text-align: center; width: 250px; float: right; margin-right: 20px; }
        .footer-text { text-align: left; margin-bottom: 30px; }
        .footer-line { border-bottom: 1px solid #000; height: 20px; margin-bottom: 5px; }
        .footer-title { text-align: center; font-size: 9.5pt; }
    </style>
</head>
<body>
    <div class="header-container">
        <div class="header-left">CEBU TECHNOLOGICAL UNIVERSITY</div>
        <div class="header-right">
            CAR/PAR Form 3<br>
            June 2012<br>
            Revision: 0
        </div>
    </div>

    <div class="main-title">CORRECTIVE ACTION LOGSHEET</div>

    <table>
        <thead>
            <tr>
                <th style="width: 10%;">CAR<br>No.</th>
                <th style="width: 15%;">Date</th>
                <th style="width: 25%;">Department /<br>Area Affected</th>
                <th style="width: 20%;">Initiator</th>
                <th style="width: 15%;">Auditor</th>
                <th style="width: 15%;">Status</th>
            </tr>
        </thead>
        <tbody>
            [LOGSHEET_ROWS]
        </tbody>
    </table>

    <div class="footer-sig">
        <div class="footer-text">CERTIFIED CORRECT:</div>
        <div class="footer-line"></div>
        <div class="footer-title">QMR</div>
    </div>
</body>
</html>
